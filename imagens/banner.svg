    .role { font-size: 30px; font-weight: 300; fill: #c19bf7; letter-spacing: 1px; }
    .tag { font-size: 18px; font-weight: 300; fill: rgba(230,225,216,0.62); }
    .pill { font-size: 14px; fill: rgba(230,225,216,0.8); letter-spacing: 0.5px; }
    .tw { animation: tw 8s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: .85 } }
    .breathe { animation: breathe 9s ease-in-out infinite; transform-origin: 990px 210px; }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.06); opacity: 1 } }
    .cn { opacity: 0; animation: cn 26s ease-in-out -8s infinite; }
    .cn path { fill: none; stroke: rgba(0,255,255,0.3); stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 1; animation: cd 26s ease-out -8s infinite; }
    .cn circle { fill: rgba(232,228,220,0.7); }
    .cn .cx { stroke: #fff3d6; stroke-dasharray: none; stroke-dashoffset: 0; animation: cp 7s ease-in-out infinite; }
    @keyframes cn { 0% { opacity: 0 } 12%, 70% { opacity: 1 } 88%, 100% { opacity: 0 } }
    @keyframes cd { 0% { stroke-dashoffset: 1 } 30%, 100% { stroke-dashoffset: 0 } }
    @keyframes cp { 0%, 100% { opacity: .25 } 50% { opacity: .7 } }
    @media (prefers-reduced-motion: reduce) { .tw, .breathe, .cn, .cn path, .cn .cx { animation: none } .cn { opacity: .55 } .cn path { stroke-dashoffset: 0 } }
  </style>

